services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi
      POSTGRES_DB: lumi
    ports:
      - "55432:5432"
    volumes:
      - lumi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - lumi-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumi
      MINIO_ROOT_PASSWORD: lumi-local-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - lumi-minio:/data

volumes:
  lumi-postgres:
  lumi-redis:
  lumi-minio:
