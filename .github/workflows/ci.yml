name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumi -d lumi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lumi:lumi@127.0.0.1:5432/lumi?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:5173
      FREE_MODE: 'true'
      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_REGION: us-east-1
      S3_BUCKET: lumi-media
      S3_ACCESS_KEY: lumi
      S3_SECRET_KEY: lumi-local-secret
      LOCAL_ADMIN_OPEN_IDS: admin-smoke
      PORT: 4300
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check
      - name: Empty database and legacy upgrade regression
        run: pnpm test:migrations
      - name: Quota concurrency and generation recovery on isolated PostgreSQL
        run: pnpm --filter @lumi/api test:quota
      - name: Start private development object storage
        run: |
          docker compose up -d seaweedfs
          pnpm --filter @lumi/api storage:init-local
      - name: Database schema and API integration
        run: |
          pnpm db:deploy
          pnpm --filter @lumi/api start > /tmp/lumi-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4300/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4300/api/v1/health >/dev/null || { cat /tmp/lumi-api.log; exit 1; }
          pnpm --filter @lumi/api test:integration
          LUMI_API_URL=http://127.0.0.1:4300/api/v1 pnpm --filter @lumi/api test:storage
          LUMI_API_URL=http://127.0.0.1:4300/api/v1 pnpm --filter @lumi/api test:try-on-client
          LUMI_API_URL=http://127.0.0.1:4300/api/v1 pnpm --filter @lumi/api test:results
          LUMI_API_URL=http://127.0.0.1:4300/api/v1 pnpm --filter @lumi/api test:publishing-client
